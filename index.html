<!doctype html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Army Runner Crowd Master</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;font-family:system-ui,sans-serif}#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;top:14px;left:14px;right:14px;z-index:2;display:none;gap:10px;align-items:center;color:white;pointer-events:none}.pill{background:#101827cc;padding:9px 13px;border-radius:12px;font-weight:700}#progressWrap{flex:1;height:11px;background:#ffffff45;border-radius:20px;overflow:hidden}#progress{height:100%;width:0;background:#35d07f}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#08111dcc;color:white;z-index:5}.panel{width:min(90vw,400px);text-align:center;background:#172338;padding:28px;border:1px solid #ffffff22;border-radius:20px}h1{margin:0 0 8px}p{color:#c7d2e2}button{border:0;border-radius:12px;padding:13px 22px;background:#ff8a24;color:#171717;font-weight:800;font-size:16px;cursor:pointer}.hidden{display:none!important}
#soundToggle{position:fixed;right:16px;bottom:16px;z-index:3;border-radius:50%;width:48px;height:48px;padding:0}
</style></head><body><div id="game"></div>
<div id="hud"><div class="pill" id="levelLabel">LEVEL 1</div><div class="pill">👥 <span id="unitCount">10</span></div><div id="progressWrap"><div id="progress"></div></div></div>
<button id="soundToggle" aria-label="Toggle sound">🔊</button>
<section id="menu" class="overlay"><div class="panel"><h1>ARMY RUNNER</h1><p id="menuLevel">ด่าน 1</p><p>ลากเมาส์หรือนิ้วซ้าย-ขวาเพื่อควบคุมกองทัพ</p><button id="startBtn">เริ่มเกม</button></div></section>
<section id="result" class="overlay hidden"><div class="panel"><h1 id="resultTitle">ชนะ!</h1><p id="resultText"></p><button id="resultBtn">ด่านถัดไป</button></div></section>
<script type="module" src="/src/main.js"></script></body></html>
